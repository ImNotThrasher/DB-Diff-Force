name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify release tag matches pom.xml
        shell: bash
        run: |
          pom_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$release_version" != "$pom_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match pom.xml version $pom_version" >&2
            exit 1
          fi

      - name: Build and run tests
        run: mvn --batch-mode verify

      - name: Package runnable distribution
        shell: bash
        run: |
          distribution="DB-Diff-Force-${GITHUB_REF_NAME}"
          mkdir "$distribution"
          cp "target/db-diff-force-${GITHUB_REF_NAME#v}.jar" "$distribution/"
          cp -R target/lib "$distribution/"
          cp LICENSE README.md "$distribution/"
          jar_file="db-diff-force-${GITHUB_REF_NAME#v}.jar"
          cat > "$distribution/run.bat" <<EOF
          @echo off
          setlocal
          set "APP_JAR=%~dp0${jar_file}"
          if not exist "%APP_JAR%" (
            echo Could not find the application JAR: "%APP_JAR%"
            pause
            exit /b 1
          )
          rem Use the same Windows .jar file association as double-clicking the JAR.
          start "" "%APP_JAR%"
          endlocal
          EOF
          zip -qr "$distribution.zip" "$distribution"

      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "DB-Diff-Force-${GITHUB_REF_NAME}.zip" \
            --clobber

name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify release tag matches pom.xml
        shell: bash
        run: |
          pom_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$release_version" != "$pom_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match pom.xml version $pom_version" >&2
            exit 1
          fi

      - name: Build and run tests
        run: mvn --batch-mode verify

      - name: Package runnable distribution
        shell: bash
        run: |
          distribution="DB-Diff-Force-${GITHUB_REF_NAME}"
          mkdir "$distribution"
          cp "target/db-diff-force-${GITHUB_REF_NAME#v}.jar" "$distribution/"
          cp -R target/lib "$distribution/"
          cp LICENSE README.md "$distribution/"
          cat > "$distribution/run.bat" <<'EOF'
          @echo off
          setlocal
          where javaw >nul 2>nul || (echo Java 21 or later is required and must be available on PATH.& exit /b 1)
          start "DB-Diff-Force" javaw -jar "%~dp0db-diff-force-${GITHUB_REF_NAME#v}.jar"
          endlocal
          EOF
          zip -qr "$distribution.zip" "$distribution"

      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "DB-Diff-Force-${GITHUB_REF_NAME}.zip" \
            --clobber
